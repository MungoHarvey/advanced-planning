name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Markdown linting ─────────────────────────────────────────────────
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown files
        run: |
          markdownlint-cli2 \
            "**/*.md" \
            "!node_modules/**" \
            "!.venv/**" \
            --config .markdownlint.json || true
        # || true: lint warnings don't fail the build on first release;
        # remove once all docs conform to the style guide.

  # ── Job 2: JSON schema validation ──────────────────────────────────────────
  schema-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON schema files are well-formed
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          # Import the zero-dependency validator to check structural validity
          from platforms.python.minischema import validate, UnsupportedKeyword

          schema_dir = pathlib.Path('core/state')
          errors = []
          parse_errors = []

          for f in schema_dir.glob('*.json'):
              # Step 1: Parse check (catches malformed JSON)
              try:
                  schema = json.loads(f.read_text())
              except json.JSONDecodeError as e:
                  parse_errors.append(f'PARSE FAIL: {f}: {e}')
                  continue

              # Step 2: Structural check (catches typos, unknown keywords, invalid type values)
              try:
                  validate({}, schema)  # Empty instance; we only care that the schema itself is valid
                  print(f'OK: {f}')
              except UnsupportedKeyword as e:
                  errors.append(f'STRUCTURAL FAIL: {f}: {e}')

          # Report results
          if parse_errors:
              for err in parse_errors:
                  print(err)
          if errors:
              for err in errors:
                  print(err)

          total = len(list(schema_dir.glob('*.json')))
          ok_count = total - len(parse_errors) - len(errors)

          if parse_errors or errors:
              print(f'\n{ok_count}/{total} schemas valid.')
              sys.exit(1)

          print(f'\nAll {total} schema files valid.')
          PY
        # Uses minischema validator to catch unknown keywords (e.g. 'requried' typo)
        # and invalid type values. The *.json glob is deliberate: non-schema files
        # dropped in core/state/ now fail loudly because their keys are not schema
        # keywords. Tightening to *.schema.json would silently skip them instead.

  # ── Job 3: Python tests ─────────────────────────────────────────────────────
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert interpreters present (sh and pwsh)
        run: |
          set -e
          command -v sh
          command -v pwsh
        # Fails the job if either interpreter is missing. This is the fast,
        # legible failure path — the env-var backstop below is the structural
        # guard if this step is ever edited away.

      - name: Install pytest
        run: pip install pytest

      - name: Run tests (adapter interpreters required)
        run: |
          AP_REQUIRE_ADAPTER_INTERPRETERS=1 python -m pytest platforms/python/tests/ -v --tb=short
        # AP_REQUIRE_ADAPTER_INTERPRETERS=1 escalates missing-interpreter from
        # skip to fail. This is the backstop if the assertion step above is
        # ever edited away. Both are needed: the assertion fails fast with a
        # legible message; the env-var is a structural guard in the process.

      - name: Verify no external dependencies
        run: |
          python -m platforms.python.ast_check platforms/python/ --exclude tests/ --exclude examples/

  # ── Job 4: Path-convention audit ───────────────────────────────────────────
  path-convention-audit:
    name: Path Convention Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Path convention audit (deprecated + host-neutrality)
        run: |
          python -m platforms.python.path_audit
        # Scans the roots in path_audit.DEFAULT_SCANNED_ROOTS for two families of
        # violation: (a) deprecated/corrupted path tokens, everywhere it scans
        # (docs/path-conventions.md, "Deprecated Path Tokens"); (b) host-neutrality
        # under core/ only -- host directories, host-only tool names, host
        # permission syntax (same doc, "Host-Neutrality Rule (§7.3)").
        # Exits non-zero if any violation is found. Known exceptions are keyed by
        # (file, rule), are printed in full with reason and retirement plan, and do
        # not blind that file to other rules; a run with only exceptions prints
        # "PASSED WITH N SUPPRESSED" and exits 0.

      - name: Install into the runner's global layer
        run: |
          sh setup/claude-code/install.sh --global
        # The audit below needs an installed layer to compare against, and a fresh
        # checkout has none it can use: .gitignore excludes .claude/* (everything but
        # settings.json), so the project layer can never hold commands, agents or
        # schemas on a runner. The global layer can -- HOME on a runner is disposable,
        # so installing into it costs nothing and gives the audit a real subject.

      - name: Audit install-layer drift (source vs global)
        run: |
          python -m platforms.python.install_audit --layers source,global
        # Compares platforms/claude-code/commands+agents/ and core/schemas/ against
        # ~/.claude/commands|agents|schemas as produced by the step above, so a pass
        # here means the installer reproduces every source file byte-for-byte, after
        # EOL and launcher-path normalisation. Exits non-zero on any stale or missing
        # file; fix drift by running /sync-install.
        #
        # This replaced `--layers source,project`, which could not pass on a runner:
        # .claude/settings.json IS tracked, so .claude/ exists, install_audit's
        # "not found -- skipped" guard never fires, and all 27 source files read as
        # missing. Do not "fix" a failure here by dropping the install step above --
        # a missing layer is skipped with a note and the job returns 0 having audited
        # nothing. TestCIAuditsALayerItCanActuallyHave fails the build if either the
        # gitignored layer or the uninstalled one comes back.
