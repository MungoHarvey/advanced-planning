name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Markdown linting ─────────────────────────────────────────────────
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown files
        run: |
          markdownlint-cli2 \
            "**/*.md" \
            "!node_modules/**" \
            "!.venv/**" \
            --config .markdownlint.json || true
        # || true: lint warnings don't fail the build on first release;
        # remove once all docs conform to the style guide.

  # ── Job 2: JSON schema validation ──────────────────────────────────────────
  schema-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON schema files are well-formed
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          # Import the zero-dependency validator to check structural validity
          from platforms.python.tests.minischema import validate, UnsupportedKeyword

          schema_dir = pathlib.Path('core/state')
          errors = []
          parse_errors = []

          for f in schema_dir.glob('*.json'):
              # Step 1: Parse check (catches malformed JSON)
              try:
                  schema = json.loads(f.read_text())
              except json.JSONDecodeError as e:
                  parse_errors.append(f'PARSE FAIL: {f}: {e}')
                  continue

              # Step 2: Structural check (catches typos, unknown keywords, invalid type values)
              try:
                  validate({}, schema)  # Empty instance; we only care that the schema itself is valid
                  print(f'OK: {f}')
              except UnsupportedKeyword as e:
                  errors.append(f'STRUCTURAL FAIL: {f}: {e}')

          # Report results
          if parse_errors:
              for err in parse_errors:
                  print(err)
          if errors:
              for err in errors:
                  print(err)

          total = len(list(schema_dir.glob('*.json')))
          ok_count = total - len(parse_errors) - len(errors)

          if parse_errors or errors:
              print(f'\n{ok_count}/{total} schemas valid.')
              sys.exit(1)

          print(f'\nAll {total} schema files valid.')
          PY
        # Uses minischema validator to catch unknown keywords (e.g. 'requried' typo)
        # and invalid type values. The *.json glob is deliberate: non-schema files
        # dropped in core/state/ now fail loudly because their keys are not schema
        # keywords. Tightening to *.schema.json would silently skip them instead.

  # ── Job 3: Python tests ─────────────────────────────────────────────────────
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest platforms/python/tests/ -v --tb=short

      - name: Verify no external dependencies
        run: |
          python -m platforms.python.ast_check platforms/python/ --exclude tests/ --exclude examples/

  # ── Job 4: Path-convention audit ───────────────────────────────────────────
  path-convention-audit:
    name: Path Convention Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Path convention audit (deprecated + host-neutrality)
        run: |
          python -m platforms.python.path_audit
        # Scans the roots in path_audit.DEFAULT_SCANNED_ROOTS for two families of
        # violation: (a) deprecated/corrupted path tokens, everywhere it scans
        # (docs/path-conventions.md, "Deprecated Path Tokens"); (b) host-neutrality
        # under core/ only -- host directories, host-only tool names, host
        # permission syntax (same doc, "Host-Neutrality Rule (§7.3)").
        # Exits non-zero if any violation is found. Known exceptions are keyed by
        # (file, rule), are printed in full with reason and retirement plan, and do
        # not blind that file to other rules; a run with only exceptions prints
        # "PASSED WITH N SUPPRESSED" and exits 0.

      - name: Audit install-layer drift (source vs project)
        run: |
          python -m platforms.python.install_audit --layers source,project
        # Compares platforms/claude-code/commands+agents/ and core/schemas/ against
        # .claude/commands/, .claude/agents/, .claude/schemas/ in this repo.
        # CI cannot see a developer's global ~/.claude/ dir so only the source<->project
        # pair is checked. Exits non-zero if any stale or missing files are found.
        # Fix drift by running /sync-install (or cp from source to .claude/ manually).
