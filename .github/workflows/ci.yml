name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Markdown linting ─────────────────────────────────────────────────
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown files
        run: |
          markdownlint-cli2 \
            "**/*.md" \
            "!node_modules/**" \
            "!.venv/**" \
            --config .markdownlint.json || true
        # || true: lint warnings don't fail the build on first release;
        # remove once all docs conform to the style guide.

  # ── Job 2: JSON schema validation ──────────────────────────────────────────
  schema-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate JSON schema files are well-formed
        run: |
          python -c "
          import json, pathlib, sys
          schema_dir = pathlib.Path('core/state')
          errors = []
          for f in schema_dir.glob('*.json'):
              try:
                  json.loads(f.read_text())
                  print(f'OK: {f}')
              except json.JSONDecodeError as e:
                  errors.append(f'FAIL: {f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'All {len(list(schema_dir.glob(\"*.json\")))} schema files valid.')
          "

  # ── Job 3: Python tests ─────────────────────────────────────────────────────
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest platforms/python/tests/ -v --tb=short

      - name: Verify no external dependencies
        run: |
          python -m platforms.python.ast_check platforms/python/ --exclude tests/ --exclude examples/

  # ── Job 4: Path-convention audit ───────────────────────────────────────────
  path-convention-audit:
    name: Path Convention Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit for deprecated/corrupted path tokens
        run: |
          python -m platforms.python.path_audit
        # Scans platforms/claude-code/commands/, platforms/claude-code/agents/,
        # core/agents/, core/skills/, .claude/commands/, .claude/agents/ for:
        #   - doubled prefix:  .advanced-.advanced-
        #   - wrong nesting:   .claude/.advanced-plans
        #   - deprecated token: .claude/plans/
        # Exits non-zero (fails the build) if any violation is found.
